# ============================================================
# Configuracion de la API - Veterinaria El Hogar de Las Mascotas
# ============================================================
spring.application.name=hogar-mascotas-api
server.port=8080

# --- MySQL (esquema creado por el script vetcare_bd.sql de la Fase 2) ---
spring.datasource.url=jdbc:mysql://localhost:3306/vetcare_db?useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=

# "update": Hibernate valida/complementa el esquema sin destruirlo.
# La fuente de verdad del modelo es el script de la Fase 2; esta opcion
# solo crea lo que falte (p. ej. la tabla mensaje_contacto).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# La clave debe tener 32+ caracteres (HS256). En produccion se define
# como variable de entorno, nunca en el repositorio.
app.jwt.secret=${JWT_SECRET:clave-desarrollo-hogar-mascotas-2026-cambiar}
app.jwt.expiracion-horas=8

# --- Reglas de negocio parametrizables (RN-01, RF-20) ---
app.negocio.hora-apertura=08:00
app.negocio.hora-cierre=18:00
app.negocio.antelacion-cancelacion-horas=2
