<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar - Veterinaria El Hogar de Las Mascotas</title>
  <meta name="description" content="Ingresa o crea tu cuenta en Veterinaria El Hogar de Las Mascotas para agendar citas y gestionar tus mascotas.">
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-wrap { max-width: 420px; margin: 3rem auto; padding: 0 1.5rem; }
    .auth-card { background: white; border-radius: 16px; box-shadow: var(--shadow); padding: 2rem 1.75rem; }
    .auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid var(--bg); }
    .auth-tabs button {
      flex: 1; background: none; border: none; padding: 0.75rem;
      font-weight: 700; font-size: 0.95rem; color: var(--text-light);
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px;
      font-family: inherit;
    }
    .auth-tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }
    .auth-form { display: none; flex-direction: column; gap: 1rem; }
    .auth-form.active { display: flex; }
    .auth-form label { font-size: 0.85rem; font-weight: 600; color: var(--text); display: block; }
    .auth-form input {
      width: 100%; margin-top: 0.35rem; padding: 0.65rem 0.9rem;
      border: 1px solid rgba(181, 68, 110, 0.25); border-radius: 8px;
      font-size: 0.95rem; font-family: inherit;
    }
    .auth-form input:focus { outline: none; border-color: var(--primary); }
    .auth-submit {
      background: var(--primary); color: white; border: none; padding: 0.75rem;
      border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
      transition: background 0.2s;
    }
    .auth-submit:hover { background: var(--primary-dark); }
    .auth-msg { font-size: 0.88rem; padding: 0.6rem 0.8rem; border-radius: 8px; display: none; }
    .auth-msg.error { display: block; background: #fdeaea; color: #b3261e; }
    .auth-msg.success { display: block; background: #e7f7ee; color: #1e7a45; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <a href="index.html" class="logo">🐾 Hogar de Las Mascotas</a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="servicios.html">Servicios</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
    </nav>
    <div class="header-actions" id="header-actions">
      <a href="ingresar.html" class="btn-outline">Ingresar</a>
      <a href="agendar.html" class="btn-solid">Agendar Cita</a>
    </div>
  </header>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-tabs">
          <button type="button" id="tab-login" class="active">Ingresar</button>
          <button type="button" id="tab-register">Crear cuenta</button>
        </div>

        <form id="form-login" class="auth-form active">
          <div class="auth-msg" id="login-msg"></div>
          <label>Correo electrónico
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label>Contraseña
            <input type="password" name="password" required autocomplete="current-password" />
          </label>
          <button type="submit" class="auth-submit">Ingresar</button>
        </form>

        <form id="form-register" class="auth-form">
          <div class="auth-msg" id="register-msg"></div>
          <label>Nombre completo
            <input type="text" name="nombre" required autocomplete="name" />
          </label>
          <label>Correo electrónico
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label>Contraseña (mínimo 6 caracteres)
            <input type="password" name="password" required minlength="6" autocomplete="new-password" />
          </label>
          <button type="submit" class="auth-submit">Crear cuenta</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <small>&copy; 2026 Veterinaria El Hogar de Las Mascotas. Todos los derechos reservados.</small>
  </footer>

  <script src="script.js" defer></script>
  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active'); tabRegister.classList.remove('active');
      formLogin.classList.add('active'); formRegister.classList.remove('active');
    });
    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active'); tabLogin.classList.remove('active');
      formRegister.classList.add('active'); formLogin.classList.remove('active');
    });

    function showMsg(el, text, type) {
      el.textContent = text;
      el.className = 'auth-msg ' + type;
    }

    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get('redirect') || 'agendar.html';

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('login-msg');
      const data = Object.fromEntries(new FormData(formLogin));
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const body = await res.json();
      if (!res.ok) return showMsg(msg, body.error || 'Error al ingresar.', 'error');
      window.location.href = redirectTo;
    });

    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('register-msg');
      const data = Object.fromEntries(new FormData(formRegister));
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const body = await res.json();
      if (!res.ok) return showMsg(msg, body.error || 'Error al crear la cuenta.', 'error');
      window.location.href = redirectTo;
    });
  </script>
</body>
</html>
